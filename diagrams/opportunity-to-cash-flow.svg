<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1240" height="440" fill="#ffffff"/>
  <text x="620" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Opportunity to Cash — The Revenue Spine</text>

  <g font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <rect x="24" y="110" width="128" height="76" rx="8" fill="#EAF2FF" stroke="#4F8FF7" stroke-width="2"/>
    <text x="88" y="140">Opportunity</text>
    <rect x="176" y="110" width="128" height="76" rx="8" fill="#EAF2FF" stroke="#4F8FF7" stroke-width="2"/>
    <text x="240" y="132">Quote</text><text x="240" y="150">(CPQ)</text>
    <rect x="328" y="110" width="128" height="76" rx="8" fill="#F0ECFF" stroke="#7C5CFF" stroke-width="2"/>
    <text x="392" y="140">Contract</text>
    <rect x="480" y="110" width="128" height="76" rx="8" fill="#F0ECFF" stroke="#7C5CFF" stroke-width="2"/>
    <text x="544" y="140">Order</text>
    <rect x="632" y="110" width="128" height="76" rx="8" fill="#E7F6EC" stroke="#1FA855" stroke-width="2"/>
    <text x="696" y="140">Provision</text>
    <rect x="784" y="110" width="128" height="76" rx="8" fill="#E7F6EC" stroke="#1FA855" stroke-width="2"/>
    <text x="848" y="140">Bill</text>
    <rect x="936" y="110" width="128" height="76" rx="8" fill="#FFF6E0" stroke="#E8930C" stroke-width="2"/>
    <text x="1000" y="140">Collect</text>
    <rect x="1088" y="110" width="128" height="76" rx="8" fill="#FFF6E0" stroke="#E8930C" stroke-width="2"/>
    <text x="1152" y="132">Renew /</text><text x="1152" y="150">Expand</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="88" y="168">exit criteria</text>
    <text x="240" y="168">approvals</text>
    <text x="392" y="168">e-signature</text>
    <text x="544" y="168">booked</text>
    <text x="696" y="168">time-to-value</text>
    <text x="848" y="168">accuracy</text>
    <text x="1000" y="168">dunning, DSO</text>
    <text x="1152" y="168">120 / 90 days</text>
  </g>
  <g stroke="#555" stroke-width="2">
    <line x1="152" y1="148" x2="172" y2="148" marker-end="url(#arr)"/>
    <line x1="304" y1="148" x2="324" y2="148" marker-end="url(#arr)"/>
    <line x1="456" y1="148" x2="476" y2="148" marker-end="url(#arr)"/>
    <line x1="608" y1="148" x2="628" y2="148" marker-end="url(#arr)"/>
    <line x1="760" y1="148" x2="780" y2="148" marker-end="url(#arr)"/>
    <line x1="912" y1="148" x2="932" y2="148" marker-end="url(#arr)"/>
    <line x1="1064" y1="148" x2="1084" y2="148" marker-end="url(#arr)"/>
  </g>
  <!-- feedback loop: billing/usage data back to CRM -->
  <path d="M848,186 V260 H88 V190" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="468" y="252" text-anchor="middle" font-size="12" fill="#777">billing + usage data feeds back into scoring, routing, and forecasting</text>

  <text x="620" y="400" text-anchor="middle" font-size="13" fill="#666">Every arrow is a handoff: owner, data contract, fallback. Most lead-to-cash problems are handoff problems.</text>
</svg>
